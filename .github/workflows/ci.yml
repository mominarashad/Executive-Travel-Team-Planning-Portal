name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore TravelManagement.API.Tests/TravelManagement.API.Tests.csproj

      - name: Build
        run: dotnet build TravelManagement.API.Tests/TravelManagement.API.Tests.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test TravelManagement.API.Tests/TravelManagement.API.Tests.csproj --no-build --configuration Release --verbosity normal