services:
  postgres:
    image: postgres:17
    container_name: travelmanagement-db
    restart: always
    environment:
      POSTGRES_DB: travel_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit
    container_name: travelmanagement-mailpit
    restart: always
    ports:
      - "8025:8025"   # web UI to view caught emails
      - "1025:1025"   # SMTP port the API sends to


  api:
    build:
      context: ./server/TravelManagement.API
    container_name: travelmanagement-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=travel_management;Username=postgres;Password=postgres"
      Jwt__SecretKey: "ReplaceWithARealLongRandomSigningKeyAtLeast32Chars"
      Jwt__Issuer: "TravelManagement.API"
      Jwt__Audience: "TravelManagement.Client"
      ASPNETCORE_ENVIRONMENT: "Development"
      Email__SmtpHost: "mailpit"
      Email__SmtpPort: "1025"
      Email__FromAddress: "noreply@travelmanagement.local"
      Email__FromName: "Travel Management"
    ports:
      - "5104:8080"

  web:
    build:
      context: ./client/travel-management-client
    container_name: travelmanagement-web
    restart: always
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data: